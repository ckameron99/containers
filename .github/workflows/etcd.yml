name: etcd

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize releases without interrupting a partially published set of tags.
concurrency:
  group: etcd-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/ckameron99/etcd

jobs:
  packages:
    if: github.ref == 'refs/heads/main'
    environment: main
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-latest
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false

      - name: Install melange
        run: |
          go install chainguard.dev/melange@v0.62.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Restore CI signing key
        env:
          # Keep the existing GitHub environment secret name.
          MELANGE_SIGNING_KEY: ${{ secrets.MELANCE_SIGNING_KEY }}
        run: |
          umask 077
          test -n "$MELANGE_SIGNING_KEY"
          printf '%s\n' "$MELANGE_SIGNING_KEY" > "$RUNNER_TEMP/ci-signing.rsa"

      - name: Build apk
        run: |
          melange build etcd/melange.yaml \
            --arch=${{ matrix.arch }} \
            --runner=docker \
            --repository-append=https://packages.wolfi.dev/os \
            --keyring-append=https://packages.wolfi.dev/os/wolfi-signing.rsa.pub \
            --signing-key="$RUNNER_TEMP/ci-signing.rsa" \
            --out-dir=out

      - name: Upload apk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.arch }}
          path: out/${{ matrix.arch }}
          overwrite: true
          retention-days: 1

  image:
    needs: packages
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - apk-arch: x86_64
            apko-arch: amd64
            tag: x86_64
          - apk-arch: aarch64
            apko-arch: arm64
            tag: aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false

      - name: Download apk
        uses: actions/download-artifact@v4
        with:
          name: apk-${{ matrix.apk-arch }}
          path: out/${{ matrix.apk-arch }}

      - name: Install apko
        run: |
          go install chainguard.dev/apko@v1.4.10
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Log in to GHCR
        run: apko login "$REGISTRY" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      - name: Publish image
        run: >-
          apko publish etcd/apko.yaml "${IMAGE}:${{ matrix.tag }}"
          --arch=${{ matrix.apko-arch }}
          -b out
          --repository-append=https://packages.wolfi.dev/os

  manifest:
    needs: image
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false

      - name: Install crane and yq
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
          go install github.com/mikefarah/yq/v4@v4.54.1
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Build multi-arch manifests
        run: |
          V="$(yq -er '.package.version' etcd/melange.yaml)"
          # No base argument: create a fresh index, flattening apko's per-arch
          # indexes. Replacing tags is safe; deleting manifests is not needed.
          crane index append --tag "${IMAGE}:${V}" \
            --manifest "${IMAGE}:x86_64,${IMAGE}:aarch64"
          DIGEST="$(crane digest "${IMAGE}:${V}")"
          for tag in "${V%.*}" latest; do
            crane tag "${IMAGE}@${DIGEST}" "$tag"
          done
