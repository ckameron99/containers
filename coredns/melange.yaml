# yaml-language-server: $schema=https://raw.githubusercontent.com/chainguard-dev/melange/refs/heads/main/pkg/config/schema.json
package:
  name: coredns
  version: "1.14.7"
  epoch: 0
  description: Standard DNS, Kubernetes, and Service Mesh
  copyright:
    - license: Apache-2.0
environment:
  contents:
    packages:
      - go-1.27
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/coredns/coredns
      tag: v${{package.version}}
  - uses: go/build
    with:
      go-package: go-1.27
      packages: .
      output: coredns
      tags: grpcnotrace
  - uses: strip
test:
  pipeline:
    - runs: |
        set -eu
        coredns -version
update:
  enabled: true
  github:
    identifier: coredns/coredns
    strip-prefix: v
