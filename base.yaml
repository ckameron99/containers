# Shared apko base for all containers in this repo.
# Included from per-container apko yamls via `include: base.yaml` (apko
# resolves include paths relative to the working directory, i.e. the repo root).
#
# Merge semantics (verified): deep merge, child scalars override, lists append.
# Child contents.packages are ADDED to this list.
layering:
  strategy: origin
  budget: 16
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - ci-signing.rsa.pub
  runtime_repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - busybox-full
    - ca-certificates-bundle
accounts:
  groups:
    - groupname: nonroot
      gid: 568
  users:
    - username: nonroot
      uid: 568
  run-as: nonroot
archs:
  - amd64
  - arm64
